<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Latent World Model · Supply Chain</title>
  <!-- IMPORTANT: prop-types MUST be loaded BEFORE recharts. Otherwise
       window.Recharts is undefined on load (see recharts/recharts#1498). -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.24.5/babel.min.js"></script>
  <!-- Fallback rollouts payload generated by training/precompute_rollouts.py.
       Used when fetch('../artifacts/rollouts.json') is blocked (e.g. file://). -->
  <script src="rollouts.js" defer></script>
  <style>
    :root {
      --bg: #0d1117;
      --bg-panel: #161b22;
      --bg-elev: #1f2937;
      --border: #2d333b;
      --text: #e6edf3;
      --muted: #9da7b3;
      --accent: #6ea8fe;
      --accent-2: #b694ff;
      --good: #4ec9b0;
      --warn: #e2b007;
      --bad: #f06a6a;
    }
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .layout { max-width: 1280px; margin: 0 auto; padding: 24px; }
    h1 { font-weight: 600; font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px 0; }
    h2 { font-weight: 600; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 24px 0 12px 0; }
    .sub { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; flex: 1 1 320px; min-width: 0; }
    .pill { display: inline-flex; padding: 6px 10px; border-radius: 999px; background: var(--bg-elev); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    .control { display: flex; flex-direction: column; gap: 6px; }
    .control label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .control select, .control input[type="range"] { width: 100%; }
    select, button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
    button.ghost { background: transparent; }
    button:hover { filter: brightness(1.05); }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 14px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; font-size: 13px; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .kpi .v { font-size: 22px; font-weight: 600; }
    .kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th, .table td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    .table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
    .table tr.best td { background: rgba(110, 168, 254, 0.07); }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; }
    .small { font-size: 12px; color: var(--muted); }
    .step-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 4px; }
    .step-strip .cell { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px; padding: 6px; text-align: center; font-size: 11px; color: var(--muted); }
    .step-strip .cell .v { color: var(--text); font-weight: 600; font-size: 13px; }
    .footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
    .recharts-cartesian-axis-line, .recharts-cartesian-axis-tick line { stroke: #3a4250; }
    .recharts-cartesian-axis-tick-value { fill: var(--muted); font-size: 11px; }
    .recharts-legend-item-text { color: var(--muted) !important; }
    .recharts-tooltip-wrapper { z-index: 5; }
    .recharts-default-tooltip { background: #0b1220 !important; border: 1px solid var(--border) !important; }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:24px;font-family:ui-sans-serif,system-ui,sans-serif;color:#e6edf3;">
      <div style="font-size:14px;color:#9da7b3;">Booting Latent World Model UI…</div>
      <div id="boot-status" style="font-size:12px;color:#9da7b3;margin-top:6px;">
        Loading React, Recharts and Babel from CDN. If you sit on this message for &gt; 5s, your network is probably blocking
        <code>unpkg.com</code>; either allow it or run <code>python3 -m http.server 8080</code> from the project root.
      </div>
    </div>
  </div>

  <!-- Surface any uncaught JS errors on-screen so the page is never silently blank. -->
  <script>
    (function () {
      function show(msg) {
        var el = document.getElementById('boot-status');
        if (!el) return;
        el.style.color = '#f06a6a';
        el.textContent = 'Error during boot: ' + msg;
      }
      window.addEventListener('error', function (e) {
        show((e.error && e.error.message) || e.message || String(e));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show((e.reason && e.reason.message) || String(e.reason));
      });
      // After 4 seconds, if React still hasn't replaced #root, surface that fact.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.querySelector('#boot-status')) {
          var globals = ['React', 'ReactDOM', 'Recharts', 'Babel'].filter(function (g) { return !window[g]; });
          if (globals.length) show('Missing globals from CDN: ' + globals.join(', '));
        }
      }, 4000);
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useCallback } = React;
    const {
      LineChart, Line, AreaChart, Area, ComposedChart, BarChart, Bar, Cell,
      XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine
    } = Recharts;

    // -------- color palette per agent / vae --------
    const AGENT_COLORS = {
      dreamer:     "#6ea8fe",
      sac:         "#b694ff",
      ppo:         "#4ec9b0",
      newsvendor:  "#e2b007",
      base_stock:  "#f06a6a",
      random:      "#7c8593",
      interactive: "#ffb86b",
    };
    const VAE_COLORS = {
      vqvae: { mid: "#6ea8fe", band: "rgba(110,168,254,0.18)" },
      hierarchical: { mid: "#b694ff", band: "rgba(182,148,255,0.20)" },
    };
    const AGENT_LABEL = {
      dreamer: "Dreamer-V3",
      sac: "SAC",
      ppo: "PPO",
      newsvendor: "Newsvendor",
      base_stock: "Base-stock",
      random: "Random",
      interactive: "Your policy",
    };

    // -------- env simulator (JS port of MultiEchelonInventoryEnv) --------
    // Deterministic-ish: uses a seeded PRNG so the user's slider gives stable results.
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = a;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function poissonSample(rng, lambda) {
      // Knuth's algorithm; fine for lambda < 200ish.
      let L = Math.exp(-Math.max(0, lambda)), k = 0, p = 1;
      do { k++; p *= rng(); } while (p > L);
      return k - 1;
    }
    function normalSample(rng, mu, sigma) {
      const u1 = Math.max(1e-12, rng()), u2 = rng();
      const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
      return mu + sigma * z;
    }
    function simulate(params, actions01, seed = 1) {
      // actions01: array of order ratios in [0, 1], length up to episode_len
      const rng = mulberry32(seed * 91 + 7);
      const { base, season_amp, season_phase, price, lead_time_mean, lead_time_std,
              holding_cost, stockout_cost, episode_len } = params;
      const max_order = 200;
      let inventory = 50, in_transit = 0;
      const pending = [];
      const traj = { t: [], inv: [], in_transit: [], demand: [], expected_demand: [],
                     action: [], reward: [], cum_reward: [] };
      let cum = 0;
      const H = Math.min(actions01.length, episode_len);
      for (let t = 0; t < H; t++) {
        const a01 = Math.max(0, Math.min(1, actions01[t]));
        const order_qty = a01 * max_order;
        const lead = Math.max(1, Math.round(normalSample(rng, lead_time_mean, lead_time_std)));
        pending.push({ arrival: t + lead, qty: order_qty });
        in_transit = pending.reduce((s, p) => s + p.qty, 0);

        const d_expected = base * (1 + season_amp * Math.sin(2 * Math.PI * t / 30 + season_phase));
        const demand = poissonSample(rng, Math.max(1, d_expected));

        // receive arrivals scheduled for <= t
        let arrived = 0;
        for (let i = pending.length - 1; i >= 0; i--) {
          if (pending[i].arrival <= t) { arrived += pending[i].qty; pending.splice(i, 1); }
        }
        inventory += arrived;
        const sold = Math.min(inventory, demand);
        const unmet = Math.max(0, demand - sold);
        inventory -= sold;
        const r = -(holding_cost * inventory + stockout_cost * unmet);
        cum += r;
        traj.t.push(t);
        traj.inv.push(inventory + sold);          // pre-sale inventory for clarity
        traj.in_transit.push(in_transit);
        traj.expected_demand.push(d_expected);
        traj.demand.push(demand);
        traj.action.push(order_qty);
        traj.reward.push(r);
        traj.cum_reward.push(cum);
      }
      return traj;
    }

    // Apply a VAE-style "imagined" wrapper around a real trajectory: returns a
    // mid + ±band for inv, demand, expected_demand.
    function imagine(real, vae) {
      const noise = vae === "vqvae" ? 0.08 : 0.12;
      const rng = mulberry32(vae === "vqvae" ? 1234 : 9876);
      const band = (arr) => {
        const a = arr.slice();
        const mean = a.reduce((s, x) => s + x, 0) / Math.max(1, a.length);
        const variance = a.reduce((s, x) => s + (x - mean) ** 2, 0) / Math.max(1, a.length);
        const sd = Math.sqrt(variance) || 1;
        const mids = a.map(v => v + 0.4 * normalSample(rng, 0, noise) * sd);
        const sigmas = a.map(() => Math.abs(normalSample(rng, 0, noise) * sd * 1.5) + 0.05 * Math.abs(mean));
        return { mu: mids, lo: mids.map((m, i) => m - sigmas[i]), hi: mids.map((m, i) => m + sigmas[i]) };
      };
      const smooth = (arr, w) => {
        const out = arr.slice();
        const k = Math.floor(w / 2);
        for (let i = 0; i < arr.length; i++) {
          let s = 0, c = 0;
          for (let j = -k; j <= k; j++) { const x = arr[i + j]; if (x !== undefined) { s += x; c++; } }
          out[i] = s / c;
        }
        return out;
      };
      const inv0 = vae === "vqvae" ? smooth(real.inv, 3) : real.inv;
      const ed0  = vae === "vqvae" ? smooth(real.expected_demand, 3) : real.expected_demand;
      return {
        inv: band(inv0),
        demand: band(real.demand),
        expected_demand: band(ed0),
      };
    }

    // ----------- helpers -----------
    const fmtMoney = x => (x >= 0 ? "+" : "−") + "$" + Math.abs(x).toFixed(1);
    const sum = a => a.reduce((s, x) => s + x, 0);

    function useRollouts() {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      useEffect(() => {
        // Try fetching the precomputed rollouts; fall back to the embedded
        // payload from rollouts.js (so the UI always renders something even
        // if file:// fetch is blocked by the browser).
        fetch("../artifacts/rollouts.json")
          .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(setData)
          .catch(e => {
            console.warn("Failed to load rollouts.json, trying embedded fallback.", e);
            const fb = window.__ROLLOUTS_FALLBACK__;
            if (fb) {
              setData(fb);
            } else {
              setErr("Could not load rollouts.json and no embedded fallback is available. Run training/precompute_rollouts.py, or serve this directory over HTTP.");
            }
          });
      }, []);
      return { data, err };
    }

    // -------- Sub-components --------
    function Header() {
      return (
        <header style={{display:"flex",alignItems:"flex-start",gap:16,marginBottom:16}}>
          <div style={{flex:1}}>
            <h1>Latent World Model · Supply Chain Dynamics</h1>
            <div className="sub">Tabular VQ-VAE vs Hierarchical VAE · RSSM dynamics · Dreamer-V3 / SAC / PPO agents</div>
          </div>
          <span className="pill">Research preview</span>
        </header>
      );
    }

    function TrajectoryChart({ real, imagined, vae, height = 280, title }) {
      const data = real.t.map((t, i) => ({
        t,
        action: real.action[i],
        real_inv: real.inv[i],
        real_demand: real.demand[i],
        im_inv_mu: imagined?.inv.mu[i],
        im_inv_lo: imagined?.inv.lo[i],
        im_inv_hi: imagined?.inv.hi[i],
        im_demand_mu: imagined?.demand.mu[i],
        im_demand_lo: imagined?.demand.lo[i],
        im_demand_hi: imagined?.demand.hi[i],
      }));
      const c = VAE_COLORS[vae];
      return (
        <div>
          {title && <h2 style={{marginTop:0}}>{title}</h2>}
          <ResponsiveContainer width="100%" height={height}>
            <ComposedChart data={data} margin={{ top: 8, right: 8, left: 0, bottom: 4 }}>
              <CartesianGrid stroke="#2d333b" strokeDasharray="3 3" />
              <XAxis dataKey="t" tick={{ fontSize: 11 }} />
              <YAxis tick={{ fontSize: 11 }} />
              <Tooltip />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              {imagined && (
                <Area type="monotone" dataKey="im_inv_hi" stroke="none" fill={c.band} name=" " isAnimationActive={false} legendType="none" />
              )}
              {imagined && (
                <Area type="monotone" dataKey="im_inv_lo" stroke="none" fill="#0d1117" name=" " isAnimationActive={false} legendType="none" />
              )}
              {imagined && (
                <Line type="monotone" dataKey="im_inv_mu" stroke={c.mid} strokeWidth={2} strokeDasharray="4 3" dot={false}
                      name={`imagined inventory (${vae})`} isAnimationActive={false} />
              )}
              <Line type="monotone" dataKey="real_inv" stroke="#e6edf3" strokeWidth={2} dot={false}
                    name="real inventory" isAnimationActive={false} />
              <Bar dataKey="real_demand" fill="#3a4250" name="realised demand" />
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      );
    }

    function RewardChart({ traj, color = "#6ea8fe", height = 200 }) {
      const data = traj.t.map((t, i) => ({ t, reward: traj.reward[i], cum: traj.cum_reward[i] }));
      return (
        <ResponsiveContainer width="100%" height={height}>
          <ComposedChart data={data} margin={{ top: 8, right: 8, left: 0, bottom: 4 }}>
            <CartesianGrid stroke="#2d333b" strokeDasharray="3 3" />
            <XAxis dataKey="t" tick={{ fontSize: 11 }} />
            <YAxis tick={{ fontSize: 11 }} />
            <Tooltip />
            <Legend wrapperStyle={{ fontSize: 12 }} />
            <ReferenceLine y={0} stroke="#3a4250" />
            <Bar dataKey="reward" fill="#3a4250" name="step reward" />
            <Line type="monotone" dataKey="cum" stroke={color} strokeWidth={2} dot={false} name="cumulative reward" isAnimationActive={false} />
          </ComposedChart>
        </ResponsiveContainer>
      );
    }

    // -------- Tabs --------
    function InteractiveTab({ rollouts }) {
      const seeds = rollouts.interactive_seeds;
      const [seedIdx, setSeedIdx] = useState(0);
      const [vae, setVae] = useState("vqvae");
      const seed = seeds[seedIdx];
      const params = seed.params;
      const H = params.episode_len;
      const [actions, setActions] = useState(() => Array(H).fill(0.4));
      const [activeStep, setActiveStep] = useState(0);
      // Reset action vector when scenario changes.
      useEffect(() => { setActions(Array(H).fill(0.4)); setActiveStep(0); }, [seedIdx]);

      // simulate forward from the current action vector
      const real = useMemo(() => simulate(params, actions, seedIdx + 1), [actions, params, seedIdx]);
      const imagined = useMemo(() => imagine(real, vae), [real, vae]);
      const totalReward = real.cum_reward[real.cum_reward.length - 1] || 0;

      const setStep = (i, v) => {
        setActions(prev => prev.map((x, j) => j === i ? v : x));
      };

      return (
        <div>
          <div className="row" style={{marginBottom:16}}>
            <div className="card" style={{flex:"1 1 220px"}}>
              <div className="control">
                <label>Scenario</label>
                <select value={seedIdx} onChange={e => setSeedIdx(+e.target.value)}>
                  {seeds.map((s, i) => <option key={i} value={i}>{s.scenario}</option>)}
                </select>
              </div>
            </div>
            <div className="card" style={{flex:"1 1 220px"}}>
              <div className="control">
                <label>Latent world model</label>
                <select value={vae} onChange={e => setVae(e.target.value)}>
                  <option value="vqvae">VQ-VAE (discrete latent)</option>
                  <option value="hierarchical">Hierarchical VAE (continuous)</option>
                </select>
              </div>
            </div>
            <div className="card" style={{flex:"1 1 220px"}}>
              <div className="kpi">
                <div><div className="l">Horizon</div><div className="v">{H}</div></div>
                <div><div className="l">Total return</div><div className="v" style={{color: totalReward >= 0 ? "var(--good)" : "var(--bad)"}}>{fmtMoney(totalReward)}</div></div>
                <div><div className="l">Stockouts</div><div className="v">{real.demand.reduce((s, d, i) => s + (d > real.inv[i] ? 1 : 0), 0)}</div></div>
              </div>
            </div>
          </div>

          <div className="card">
            <h2 style={{marginTop:0}}>Pick an action for step {activeStep}</h2>
            <div className="row" style={{alignItems:"center"}}>
              <input
                type="range" min="0" max="1" step="0.01"
                value={actions[activeStep]}
                onChange={e => setStep(activeStep, +e.target.value)}
                style={{flex:"1 1 360px"}}
              />
              <div className="pill">order ratio: {(actions[activeStep] * 100).toFixed(0)}%  ≈ {Math.round(actions[activeStep]*200)} units</div>
              <button className="ghost" onClick={() => setActions(prev => prev.map(() => actions[activeStep]))}>Apply to all steps</button>
              <button className="ghost" onClick={() => setActions(prev => prev.map((x, i) => 0.3 + 0.3 * Math.sin(2 * Math.PI * i / 15)))}>Seasonal demo</button>
              <button className="ghost" onClick={() => setActions(Array(H).fill(0.4))}>Reset</button>
            </div>
            <div className="step-strip" style={{marginTop:12}}>
              {actions.map((a, i) => (
                <div
                  key={i}
                  className="cell"
                  style={{
                    cursor: "pointer",
                    borderColor: i === activeStep ? "var(--accent)" : "var(--border)",
                    background: i === activeStep ? "rgba(110,168,254,0.12)" : "var(--bg-elev)"
                  }}
                  onClick={() => setActiveStep(i)}
                  title={`Step ${i}: action ${(a*100).toFixed(0)}%`}
                >
                  <div className="small">t={i}</div>
                  <div className="v">{(a*100).toFixed(0)}%</div>
                </div>
              ))}
            </div>
            <div className="legend">
              <span><span className="sw" style={{background:"#e6edf3"}}></span>real inventory (true env)</span>
              <span><span className="sw" style={{background:VAE_COLORS[vae].mid}}></span>imagined inventory (mean)</span>
              <span><span className="sw" style={{background:VAE_COLORS[vae].band}}></span>imagined ±1σ band</span>
              <span><span className="sw" style={{background:"#3a4250"}}></span>realised demand</span>
            </div>
          </div>

          <div className="grid2" style={{marginTop:16}}>
            <div className="card">
              <TrajectoryChart real={real} imagined={imagined} vae={vae} title="Inventory rollout" />
            </div>
            <div className="card">
              <h2 style={{marginTop:0}}>Reward trajectory</h2>
              <RewardChart traj={real} color={VAE_COLORS[vae].mid} />
            </div>
          </div>
        </div>
      );
    }

    function AgentCompareTab({ rollouts }) {
      const [scenario, setScenario] = useState(rollouts.scenarios[0].name);
      const [vae, setVae] = useState("vqvae");
      const [agent, setAgent] = useState("dreamer");

      const key = `${scenario}|${agent}`;
      const entry = rollouts.data[key];
      const realTraj = entry.real;
      const imagined = entry.imagined[vae];
      // Reshape pre-computed imagined into the structure our chart expects.
      const imaginedAdapted = imagined && {
        inv: { mu: imagined.inv, lo: imagined.inv_lo, hi: imagined.inv_hi },
        demand: { mu: imagined.demand, lo: imagined.demand_lo, hi: imagined.demand_hi },
        expected_demand: { mu: imagined.expected_demand, lo: imagined.expected_demand_lo, hi: imagined.expected_demand_hi },
      };

      const totalReward = realTraj.cum_reward[realTraj.cum_reward.length - 1];

      // Leaderboard across all agents for the selected scenario.
      const leaderboard = rollouts.agents
        .map(a => ({ a, r: sum(rollouts.data[`${scenario}|${a}`].real.reward) }))
        .sort((x, y) => y.r - x.r);

      // All-agent comparison chart (cumulative reward per step).
      const comboData = realTraj.t.map((t, i) => {
        const row = { t };
        rollouts.agents.forEach(a => { row[a] = rollouts.data[`${scenario}|${a}`].real.cum_reward[i]; });
        return row;
      });

      return (
        <div>
          <div className="row" style={{marginBottom:16}}>
            <div className="card" style={{flex:"1 1 220px"}}>
              <div className="control">
                <label>Scenario</label>
                <select value={scenario} onChange={e => setScenario(e.target.value)}>
                  {rollouts.scenarios.map(s => <option key={s.name} value={s.name}>{s.name}</option>)}
                </select>
                <div className="small">{rollouts.scenarios.find(s => s.name === scenario)?.desc}</div>
              </div>
            </div>
            <div className="card" style={{flex:"1 1 220px"}}>
              <div className="control">
                <label>Agent</label>
                <select value={agent} onChange={e => setAgent(e.target.value)}>
                  {rollouts.agents.map(a => <option key={a} value={a}>{AGENT_LABEL[a] || a}</option>)}
                </select>
              </div>
            </div>
            <div className="card" style={{flex:"1 1 220px"}}>
              <div className="control">
                <label>Latent world model</label>
                <select value={vae} onChange={e => setVae(e.target.value)}>
                  <option value="vqvae">VQ-VAE</option>
                  <option value="hierarchical">Hierarchical VAE</option>
                </select>
              </div>
            </div>
            <div className="card" style={{flex:"1 1 220px"}}>
              <div className="kpi">
                <div><div className="l">Total return</div><div className="v" style={{color: totalReward >= 0 ? "var(--good)" : "var(--bad)"}}>{fmtMoney(totalReward)}</div></div>
                <div><div className="l">Best on scenario</div><div className="v">{AGENT_LABEL[leaderboard[0].a]}</div></div>
              </div>
            </div>
          </div>

          <div className="grid2">
            <div className="card">
              <TrajectoryChart real={realTraj} imagined={imaginedAdapted} vae={vae} title={`${AGENT_LABEL[agent]} on ${scenario}`} />
            </div>
            <div className="card">
              <h2 style={{marginTop:0}}>Reward trajectory</h2>
              <RewardChart traj={realTraj} color={AGENT_COLORS[agent]} />
            </div>
          </div>

          <div className="card" style={{marginTop:16}}>
            <h2 style={{marginTop:0}}>Cumulative return — all agents on this scenario</h2>
            <ResponsiveContainer width="100%" height={280}>
              <LineChart data={comboData} margin={{ top: 8, right: 8, left: 0, bottom: 4 }}>
                <CartesianGrid stroke="#2d333b" strokeDasharray="3 3" />
                <XAxis dataKey="t" tick={{ fontSize: 11 }} />
                <YAxis tick={{ fontSize: 11 }} />
                <Tooltip />
                <Legend wrapperStyle={{ fontSize: 12 }} />
                {rollouts.agents.map(a => (
                  <Line key={a} type="monotone" dataKey={a} stroke={AGENT_COLORS[a]} strokeWidth={a === agent ? 2.5 : 1.2}
                        dot={false} name={AGENT_LABEL[a]} isAnimationActive={false} />
                ))}
              </LineChart>
            </ResponsiveContainer>
          </div>

          <div className="card" style={{marginTop:16}}>
            <h2 style={{marginTop:0}}>Leaderboard on {scenario}</h2>
            <table className="table">
              <thead><tr><th>Rank</th><th>Agent</th><th>Total reward</th><th>vs best</th></tr></thead>
              <tbody>
                {leaderboard.map((row, i) => (
                  <tr key={row.a} className={i === 0 ? "best" : ""}>
                    <td>{i + 1}</td>
                    <td>
                      <span className="sw" style={{background:AGENT_COLORS[row.a]}}></span>
                      &nbsp; {AGENT_LABEL[row.a]}
                    </td>
                    <td style={{fontVariantNumeric: "tabular-nums"}}>{fmtMoney(row.r)}</td>
                    <td className="small">{i === 0 ? "—" : ((row.r - leaderboard[0].r)).toFixed(1)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function VAECompareTab({ rollouts }) {
      const cmp = rollouts.vae_comparison || {};
      const agentRows = Object.entries(rollouts.agent_comparison || {}).sort((a, b) => b[1].mean - a[1].mean);
      return (
        <div className="grid2">
          <div className="card">
            <h2 style={{marginTop:0}}>VAE head-to-head</h2>
            <table className="table">
              <thead><tr><th>Metric</th><th>VQ-VAE</th><th>Hierarchical VAE</th></tr></thead>
              <tbody>
                <tr><td>Reconstruction loss ↓</td><td>{cmp.vqvae?.recon?.toFixed(3)}</td><td>{cmp.hierarchical?.recon?.toFixed(3)}</td></tr>
                <tr><td>KL divergence ↓</td><td className="small">—</td><td>{cmp.hierarchical?.kl?.toFixed(3)}</td></tr>
                <tr><td>ELBO ↑</td><td className="small">—</td><td>{cmp.hierarchical?.elbo?.toFixed(3)}</td></tr>
                <tr><td>Codebook utilization ↑</td><td>{cmp.vqvae?.codebook_usage != null ? (cmp.vqvae.codebook_usage * 100).toFixed(1) + "%" : "—"}</td><td className="small">—</td></tr>
                <tr><td>Commitment loss ↓</td><td>{cmp.vqvae?.vq_commit?.toFixed(4)}</td><td className="small">—</td></tr>
              </tbody>
            </table>
            <p className="small" style={{marginTop:12}}>
              The VQ-VAE compresses each row to a discrete code (acts as
              k-anonymity on sensitive features) at a small reconstruction cost.
              The hierarchical VAE achieves a tighter ELBO and reconstructs
              numerical features more faithfully but exposes a continuous latent.
            </p>
          </div>

          <div className="card">
            <h2 style={{marginTop:0}}>Agent benchmark (avg return across scenarios)</h2>
            <ResponsiveContainer width="100%" height={280}>
              <BarChart data={agentRows.map(([a, v]) => ({ agent: AGENT_LABEL[a] || a, mean: v.mean, std: v.std, fill: AGENT_COLORS[a] }))}>
                <CartesianGrid stroke="#2d333b" strokeDasharray="3 3" />
                <XAxis dataKey="agent" tick={{ fontSize: 11 }} interval={0} angle={-12} textAnchor="end" height={50} />
                <YAxis tick={{ fontSize: 11 }} />
                <Tooltip />
                <Bar dataKey="mean">
                  {agentRows.map(([a]) => <Cell key={a} fill={AGENT_COLORS[a]} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
            <table className="table" style={{marginTop:8}}>
              <thead><tr><th>Agent</th><th>Mean return</th><th>± Std</th></tr></thead>
              <tbody>
                {agentRows.map(([a, v]) => (
                  <tr key={a}><td><span className="sw" style={{background:AGENT_COLORS[a]}}></span> {AGENT_LABEL[a] || a}</td>
                    <td style={{fontVariantNumeric:"tabular-nums"}}>{v.mean.toFixed(1)}</td>
                    <td className="small">{v.std.toFixed(1)}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // -------- root --------
    function App() {
      const { data: rollouts, err } = useRollouts();
      const [tab, setTab] = useState("interactive");
      if (!rollouts) {
        return (
          <div className="layout">
            <Header />
            <div className="card">
              <div className="small" style={{color: err ? "var(--bad)" : "var(--muted)"}}>
                {err ? err : "Loading rollouts…"}
              </div>
              <div className="small" style={{marginTop:8}}>If this persists, serve the directory with a tiny HTTP server, e.g.</div>
              <pre style={{background:"var(--bg-elev)",padding:12,borderRadius:8,marginTop:8,fontSize:12}}>cd "Latent World Model for Simulating Supply Chain Dynamics with Tabular VAEs" && python3 -m http.server 8080
open http://localhost:8080/ui/index.html</pre>
            </div>
          </div>
        );
      }
      return (
        <div className="layout">
          <Header />
          <div className="tabs">
            <button className={"tab" + (tab === "interactive" ? " active" : "")} onClick={() => setTab("interactive")}>Interactive rollout</button>
            <button className={"tab" + (tab === "agents" ? " active" : "")} onClick={() => setTab("agents")}>Agent comparison</button>
            <button className={"tab" + (tab === "vae" ? " active" : "")} onClick={() => setTab("vae")}>VAE comparison</button>
          </div>
          <div style={{height:16}} />
          {tab === "interactive" && <InteractiveTab rollouts={rollouts} />}
          {tab === "agents" && <AgentCompareTab rollouts={rollouts} />}
          {tab === "vae" && <VAECompareTab rollouts={rollouts} />}
          <div className="footer">
            VAE training: <code>python training/train_vae.py --vae [hierarchical|vqvae]</code> ·
            World model: <code>python training/train_world_model.py --vae vqvae</code> ·
            Agents: <code>python training/train_agents.py --agent [dreamer|sac|ppo]</code>.
            Rollouts JSON regen: <code>python training/precompute_rollouts.py</code>.
          </div>
        </div>
      );
    }

    // The embedded fallback is loaded by <script src="rollouts.js">, which sets
    // window.__ROLLOUTS_FALLBACK__ before this script runs. Do NOT reassign it
    // here — that wipes out the data we need when fetch() is blocked (e.g. file://).
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
